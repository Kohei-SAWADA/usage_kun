name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows solution
        run: dotnet build Windows/UsageKun.Windows.sln -c Release
      - name: Run Windows core checks
        run: dotnet run --project Windows/tests/UsageKun.Core.Check -c Release --no-build
      - name: Run isolated WPF checks
        run: dotnet run --project Windows/tests/UsageKun.UI.Check -c Release --no-build
      - name: Verify bundled Windows x64 core checks
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP "usage-kun-core-check-x64"
          dotnet publish Windows/tests/UsageKun.Core.Check -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o $checkDir
          if ($LASTEXITCODE -ne 0) { throw "Bundled core check publish failed." }
          & (Join-Path $checkDir "UsageKun.Core.Check.exe")
          if ($LASTEXITCODE -ne 0) { throw "Bundled core checks failed." }
      - name: Package Windows x64
        run: ./Scripts/package_windows.ps1 -Runtime win-x64
      - name: Verify ZIP and publish a new Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content Windows/src/UsageKun.App/UsageKun.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version | Where-Object { $_ }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid Windows version." }
          $tag = "v$version"
          $notes = "docs/release-notes-$tag.md"
          if (-not (Test-Path $notes)) { throw "Release notes are missing." }
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref'
          if ($LASTEXITCODE -ne 0) { throw "Cannot verify the release tag." }
          if ($existing -contains "refs/tags/$tag") { throw "Tag already exists; refusing to replace history or assets." }
          $zip = "UsageKun-Windows-x64.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content "$zip.sha256").Trim() -split '\s+')[0]
          if ($hash -ne $expected) { throw "ZIP checksum mismatch." }
          $verifyDir = Join-Path $env:RUNNER_TEMP "usage-kun-release-verify"
          Expand-Archive $zip -DestinationPath $verifyDir
          $exe = Join-Path $verifyDir "UsageKun.exe"
          if (-not (Test-Path $exe)) { throw "ZIP does not contain UsageKun.exe." }
          if ((Get-Item $exe).VersionInfo.FileVersion -ne "$version.0") { throw "ZIP executable version mismatch." }
          Copy-Item "$zip.sha256" SHA256SUMS.txt
          gh release create $tag $zip "$zip.sha256" SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "usage_kun $tag — Windows quota accuracy" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
      - name: Keep verified Windows assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-x64
          path: |
            UsageKun-Windows-x64.zip
            UsageKun-Windows-x64.zip.sha256
          if-no-files-found: ignore
